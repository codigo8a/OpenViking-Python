version: '3.8'

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: openviking-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./qdrant_storage:/qdrant/storage
    restart: unless-stopped

  # Optional: Redis for more complex persistence or queueing
  # redis:
  #   image: redis:alpine
  #   ports:
  #     - "6379:6379"
